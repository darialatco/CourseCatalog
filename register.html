  <meta charset="UTF-8">

  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- MENIU -->
  <nav class="navbar navbar-expand-lg site-nav sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-mortarboard-fill"></i> CourseCatalog</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Meniu">
        <i class="bi bi-list"></i>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Acasă</a></li>
          <li class="nav-item"><a class="nav-link" href="courses.html">Cursuri</a></li>
          <li class="nav-item"><a class="nav-link" href="my-enrollments.html">Înscrierile mele</a></li>
          <li class="nav-item"><a class="nav-link" href="admin.html">Administrare</a></li>
          <li class="nav-item ms-lg-2"><a class="btn btn-pink" href="login.html">Autentificare</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main>
    <div class="container section">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <form class="side">
            <h1 class="h3">Cont nou</h1>
            <p class="small text-muted">Creează un cont ca să te poți înscrie la cursuri.</p>

            <label class="form-label" for="nume">Nume complet</label>
            <input id="nume" type="text" class="form-control mb-3" placeholder="Prenume Nume">

            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" class="form-control mb-3" placeholder="nume@email.ro">

            <label class="form-label" for="parola">Parolă</label>
            <input id="parola" type="password" class="form-control mb-3">

            <label class="form-label" for="parola2">Repetă parola</label>
            <input id="parola2" type="password" class="form-control mb-3">

            <button type="button" class="btn btn-pink w-100 mb-3">Creează cont</button>
            <p class="small mb-0 text-center">Ai deja cont? <a href="login.html">Autentifică-te</a></p>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- SUBSOL -->

    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-1">
